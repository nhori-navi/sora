<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見上げ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;font-size:15px}
#map{position:absolute;top:0;left:0;right:0;height:42%}
#panel{position:absolute;top:42%;bottom:0;left:0;right:0;overflow:auto;padding:8px 10px;background:#fafafa;border-top:1px solid #ccc}
@media (min-width:900px){
  #map{height:auto;bottom:0;right:420px}
  #panel{top:0;left:auto;width:420px;border-top:none;border-left:1px solid #ccc}
}
select{font-size:15px;padding:5px 8px;margin:2px 4px 2px 0}
.card{border:1px solid #ccc;border-left:6px solid #1f6fd1;border-radius:6px;padding:6px 8px;margin:6px 0;background:#fff;line-height:1.5;cursor:pointer}
.card.mil{border-left-color:#c0392b;background:#fff6f5}
.card.sel{outline:2px solid #333}
.where{font-size:13px;color:#555}
.route{font-size:19px;font-weight:bold}
.info{font-size:14px}
.small{color:#777;font-size:12px}
.plane{cursor:pointer;line-height:0}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div>
    範囲：<select id="rad"><option>10</option><option>20</option><option selected>30</option><option>50</option></select>km
    <label><input type="checkbox" id="ground">地上の機体も表示</label>
  </div>
  <div id="head" class="small">現在地を取得中…</div>
  <div id="list"></div>
  <div id="err" class="small" style="color:#c00"></div>
  <div class="small"><span id="upd"></span></div>
  <div class="small">機体データ：adsb.lol ほか（中継経由）　行き先：adsbdb</div>
</div>
<script>
// ▼▼▼ 手順1で控えた中継のアドレス（〇〇〇の部分を書き換える。最後に / は付けない） ▼▼▼
const RELAY = 'https://miage-relay.horihako.workers.dev';
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const TOKEN = 'pk.eyJ1IjoiaG9yaWhha28iLCJhIjoiY211djd0ejljMDA5ZjMycHYxaTY3M3BsdSJ9.a1yefJYynC4k_YvllM5DVw';
mapboxgl.accessToken = TOKEN;
const DEF = [139.38, 35.61]; // 現在地が取れないときの中心（南大沢付近）
const $ = id => document.getElementById(id);
const map = new mapboxgl.Map({container:'map', style:'mapbox://styles/mapbox/light-v11', center:DEF, zoom:9});
map.addControl(new mapboxgl.NavigationControl(), 'top-right');

let pos = null, usingDef = false, sel = null, planes = [], timer = null, busy = false, routeBusy = false, meMarker = null;
const markers = new Map(), routes = new Map();

// ---------- 辞書 ----------
const JA_AP = {HND:'羽田',NRT:'成田',KIX:'関西',ITM:'伊丹',UKB:'神戸',NGO:'中部',FSZ:'静岡',FUK:'福岡',CTS:'新千歳',OKA:'那覇',
  KOJ:'鹿児島',KMJ:'熊本',KMI:'宮崎',OIT:'大分',NGS:'長崎',HSG:'佐賀',KKJ:'北九州',UBJ:'山口宇部',HIJ:'広島',OKJ:'岡山',IZO:'出雲',
  YGJ:'米子',TTJ:'鳥取',MYJ:'松山',TAK:'高松',KCZ:'高知',TKS:'徳島',KMQ:'小松',TOY:'富山',NTQ:'能登',KIJ:'新潟',SDJ:'仙台',
  AOJ:'青森',AXT:'秋田',GAJ:'山形',HNA:'花巻',MSJ:'三沢',FKS:'福島',HKD:'函館',AKJ:'旭川',KUH:'釧路',OBO:'帯広',MMB:'女満別',
  WKJ:'稚内',ISG:'石垣',MMY:'宮古',ASJ:'奄美',HAC:'八丈島',OIM:'大島',MMJ:'松本',OKO:'横田',
  ICN:'ソウル仁川',GMP:'ソウル金浦',PUS:'釜山',CJU:'済州',TPE:'台北桃園',TSA:'台北松山',KHH:'高雄',HKG:'香港',MFM:'マカオ',
  PVG:'上海浦東',SHA:'上海虹橋',PEK:'北京首都',PKX:'北京大興',DLC:'大連',CAN:'広州',MNL:'マニラ',CEB:'セブ',BKK:'バンコク',
  DMK:'バンコク',SIN:'シンガポール',KUL:'クアラルンプール',CGK:'ジャカルタ',DPS:'バリ',SGN:'ホーチミン',HAN:'ハノイ',DAD:'ダナン',
  GUM:'グアム',SPN:'サイパン',HNL:'ホノルル',LAX:'ロサンゼルス',SFO:'サンフランシスコ',SEA:'シアトル',JFK:'ニューヨーク',
  ORD:'シカゴ',DFW:'ダラス',YVR:'バンクーバー',LHR:'ロンドン',CDG:'パリ',FRA:'フランクフルト',MUC:'ミュンヘン',HEL:'ヘルシンキ',
  AMS:'アムステルダム',IST:'イスタンブール',DOH:'ドーハ',DXB:'ドバイ',SYD:'シドニー',MEL:'メルボルン',BNE:'ブリスベン'};
const AIRLINE = {JAL:'日本航空',ANA:'全日空',ADO:'エア・ドゥ',SKY:'スカイマーク',SFJ:'スターフライヤー',SNJ:'ソラシドエア',
  JJP:'ジェットスター・ジャパン',APJ:'ピーチ',SJO:'スプリング・ジャパン',JTA:'日本トランスオーシャン',AKX:'ANAウイングス',
  JLJ:'J-AIR',IBX:'IBEX',FDA:'フジドリーム',NCA:'日本貨物航空',ZIP:'ZIPAIR',KAL:'大韓航空',AAR:'アシアナ',JNA:'ジンエアー',
  TWB:'ティーウェイ',JJA:'チェジュ航空',ABL:'エアプサン',ASV:'エアソウル',CAL:'チャイナエアライン',EVA:'エバー航空',
  SJX:'スターラックス',TTW:'タイガーエア台湾',CPA:'キャセイ',HKE:'香港エクスプレス',CES:'中国東方',CCA:'中国国際',
  CSN:'中国南方',UAL:'ユナイテッド',DAL:'デルタ',AAL:'アメリカン',HAL:'ハワイアン',FDX:'フェデックス',UPS:'UPS',
  SIA:'シンガポール航空',THA:'タイ国際',PAL:'フィリピン航空',CEB:'セブパシフィック',VJC:'ベトジェット',HVN:'ベトナム航空',
  QTR:'カタール',UAE:'エミレーツ',FIN:'フィンエアー',BAW:'ブリティッシュ',AFR:'エールフランス',DLH:'ルフトハンザ',
  KLM:'KLM',ACA:'エア・カナダ',QFA:'カンタス',RCH:'米空軍（輸送）',CNV:'米海軍',PAT:'米陸軍'};
const TYPE = {A20N:'エアバスA320neo',A21N:'エアバスA321neo',A319:'エアバスA319',A320:'エアバスA320',A321:'エアバスA321',
  A332:'エアバスA330-200',A333:'エアバスA330-300',A339:'エアバスA330-900',A359:'エアバスA350-900',A35K:'エアバスA350-1000',
  A388:'エアバスA380',B737:'ボーイング737-700',B738:'ボーイング737-800',B38M:'ボーイング737 MAX 8',B39M:'ボーイング737 MAX 9',
  B763:'ボーイング767-300',B764:'ボーイング767-400',B772:'ボーイング777-200',B773:'ボーイング777-300',B77W:'ボーイング777-300ER',
  B77L:'ボーイング777-200LR/F',B744:'ボーイング747-400',B748:'ボーイング747-8',B788:'ボーイング787-8',B789:'ボーイング787-9',
  B78X:'ボーイング787-10',E170:'エンブラエル170',E75L:'エンブラエル175',E190:'エンブラエル190',E195:'エンブラエル195',
  DH8D:'ボンバルディアQ400',DH8C:'ボンバルディアQ300',AT75:'ATR72-500',AT76:'ATR72-600',AT46:'ATR42-600',CRJ7:'CRJ700',MD11:'MD-11',
  BE20:'キングエア（軍用名C-12）',C12:'C-12 ヒューロン',C130:'C-130 ハーキュリーズ',C30J:'C-130J スーパーハーキュリーズ',
  V22:'V-22 オスプレイ',H60:'UH-60 ブラックホーク',C17:'C-17 グローブマスターIII',C5M:'C-5M スーパーギャラクシー',
  K35R:'KC-135 ストラトタンカー',KC46:'KC-46 ペガサス',P8:'P-8 ポセイドン',C40:'C-40 クリッパー',
  GLF5:'ガルフストリームV',GLF6:'ガルフストリームG650',GLEX:'グローバルエクスプレス',
  EC35:'EC135（ヘリ）',AS50:'AS350（ヘリ）',B06:'ベル206（ヘリ）',R44:'ロビンソンR44（ヘリ）'};

// ---------- 共通 ----------
function showErr(m) { $('err').textContent = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) + ' ' + m; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function distKm(a, b) {
  const r = Math.PI / 180, dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
function brg(a, b) {
  const r = Math.PI / 180, dl = (b[0] - a[0]) * r;
  const y = Math.sin(dl) * Math.cos(b[1] * r);
  const x = Math.cos(a[1] * r) * Math.sin(b[1] * r) - Math.sin(a[1] * r) * Math.cos(b[1] * r) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const DIRS = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
const dirName = d => DIRS[Math.round(d / 45) % 8];
function circle(c, km) {
  const pts = [], kx = 111.32 * Math.cos(c[1] * Math.PI / 180);
  for (let i = 0; i <= 64; i++) { const a = i / 64 * 2 * Math.PI; pts.push([c[0] + km / kx * Math.sin(a), c[1] + km / 110.57 * Math.cos(a)]); }
  return {type:'Feature', properties:{}, geometry:{type:'Polygon', coordinates:[pts]}};
}
const line = (a, b, k) => ({type:'Feature', properties:{k}, geometry:{type:'LineString', coordinates:[a, b]}});
function setData(id, f) { const s = map.getSource(id); if (s) s.setData({type:'FeatureCollection', features:f}); }
const PLANE = 'M12 2 L13.6 9 L22 13.5 L22 15.5 L13.6 13 L13 19 L15.5 21 L15.5 22.5 L12 21.5 L8.5 22.5 L8.5 21 L11 19 L10.4 13 L2 15.5 L2 13.5 L10.4 9 Z';
const planeSvg = (c, big) => `<svg width="${big ? 36 : 26}" height="${big ? 36 : 26}" viewBox="0 0 24 24"><path d="${PLANE}" fill="${c}" stroke="#fff" stroke-width="1"/></svg>`;

// ---------- 地図 ----------
map.on('load', () => {
  const empty = {type:'FeatureCollection', features:[]};
  map.addSource('range', {type:'geojson', data:empty});
  map.addLayer({id:'range', type:'line', source:'range',
    paint:{'line-color':'#1f6fd1', 'line-width':1.5, 'line-dasharray':[2, 2], 'line-opacity':0.6}});
  map.addSource('route', {type:'geojson', data:empty});
  map.addLayer({id:'routeFrom', type:'line', source:'route', filter:['==', ['get', 'k'], 'from'],
    paint:{'line-color':'#999', 'line-width':2}});
  map.addLayer({id:'routeTo', type:'line', source:'route', filter:['==', ['get', 'k'], 'to'],
    paint:{'line-color':'#e67e22', 'line-width':3, 'line-dasharray':[2, 1]}});
  drawRange(); drawSel();
});
function drawRange() { if (pos) setData('range', [circle(pos, Number($('rad').value))]); }

// ---------- 現在地 ----------
function setPos(p, def) {
  const first = !pos; pos = p; usingDef = def;
  if (!meMarker) {
    const el = document.createElement('div');
    el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#1e90ff;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)';
    meMarker = new mapboxgl.Marker({element:el}).setLngLat(p).addTo(map);
  } else meMarker.setLngLat(p);
  drawRange();
  if (first) { map.jumpTo({center:p, zoom:9}); start(); }
}
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(
    g => setPos([g.coords.longitude, g.coords.latitude], false),
    e => { if (!pos) setPos(DEF, true); showErr('位置情報：' + e.message); },
    {enableHighAccuracy:false, maximumAge:30000, timeout:20000});
} else setPos(DEF, true);

// ---------- 取得 ----------
function start() { clearInterval(timer); tick(); timer = setInterval(tick, 10000); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (pos) start(); } else clearInterval(timer);
});
$('rad').onchange = () => { drawRange(); tick(); };
$('ground').onchange = () => tick();

function norm(a) {
  const p = [a.lon, a.lat], ground = a.alt_baro === 'ground';
  const ft = typeof a.alt_geom === 'number' ? a.alt_geom : (typeof a.alt_baro === 'number' ? a.alt_baro : 0);
  const altM = ground ? 0 : Math.max(0, Math.round(ft * 0.3048)), dist = distKm(pos, p);
  return {hex:a.hex, cs:(a.flight || '').trim(), reg:a.r || '', type:a.t || '', p, ground, altM, dist,
    dir:brg(pos, p), elev:Math.atan2(altM, dist * 1000) * 180 / Math.PI,
    track:a.track ?? a.true_heading ?? 0, mil:!!(a.dbFlags & 1),
    rate:a.baro_rate ?? a.geom_rate ?? 0, kmh:a.gs ? Math.round(a.gs * 1.852) : null};
}
async function tick() {
  if (!pos || busy) return;
  if (RELAY.includes('〇')) { showErr('中継のアドレスが未設定です（コード上部の ▼▼▼ の下を書き換えてください）'); return; }
  busy = true;
  const km = Number($('rad').value), nm = Math.ceil(km / 1.852);
  try {
    const r = await fetch(`${RELAY}/ac/${pos[1].toFixed(4)}/${pos[0].toFixed(4)}/${nm}`);
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 80));
    const j = await r.json();
    planes = (j.ac || j.aircraft || []).filter(a => a.lat != null && a.lon != null).map(norm)
      .filter(p => p.dist <= km && ($('ground').checked || !p.ground))
      .sort((a, b) => a.dist - b.dist);
    // 将来の記録用：ここで planes を保存すれば履歴が作れる
    render();
    $('upd').textContent = '更新 ' + new Date().toLocaleTimeString('ja-JP');
    $('err').textContent = '';
    fetchRoutes(planes).then(render);
  } catch (e) { showErr('機体データの取得に失敗：' + e.message); }
  finally { busy = false; }
}
const apConv = a => ({iata:a.iata_code, icao:a.icao_code, name:a.name, location:a.municipality, lat:a.latitude, lon:a.longitude});
async function fetchRoutes(list) {
  if (routeBusy) return;
  const need = list.filter(p => !p.mil && /^[A-Z]{2,3}\d/.test(p.cs) && !routes.has(p.cs)).slice(0, 5);
  if (!need.length) return;
  routeBusy = true;
  try {
    for (const p of need) {
      try {
        const r = await fetch(`${RELAY}/route/${encodeURIComponent(p.cs)}`);
        if (r.status === 404) { routes.set(p.cs, {none:true}); continue; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json(), fr = j.response && j.response.flightroute;
        if (!fr || !fr.origin || !fr.destination) { routes.set(p.cs, {none:true}); continue; }
        routes.set(p.cs, {_airports:[apConv(fr.origin), apConv(fr.destination)]});
      } catch (e) { showErr('行き先の取得に失敗：' + e.message); break; }
    }
  } finally { routeBusy = false; }
}
function apName(ap) { return JA_AP[ap.iata] || ap.location || ap.name || ap.iata || ap.icao || '?'; }
function apPt(ap) { const lo = Number(ap.lon ?? ap.lng), la = Number(ap.lat); return isFinite(lo) && isFinite(la) ? [lo, la] : null; }
function routeInfo(p) {
  const r = routes.get(p.cs);
  if (!r || r.none || !Array.isArray(r._airports) || r._airports.length < 2) return null;
  const aps = r._airports;
  return {text:aps.map(apName).join(' → '), orig:apPt(aps[0]), dest:apPt(aps[aps.length - 1])};
}

// ---------- 表示 ----------
function cardHtml(p) {
  const ri = routeInfo(p);
  const rt = ri ? ri.text : (p.cs && !routes.has(p.cs) && !p.mil ? '行き先を調べ中…' : '行き先不明');
  const rate = p.rate > 500 ? '上昇中' : p.rate < -500 ? '下降中' : '';
  const info = [TYPE[p.type] || p.type || '機種不明', AIRLINE[p.cs.slice(0, 3)] || '', p.cs || p.reg].filter(Boolean).join('・');
  const alt = p.ground ? '地上' : `高度 ${p.altM.toLocaleString()}m ${rate}`;
  return `<div class="card${p.mil ? ' mil' : ''}${p.hex === sel ? ' sel' : ''}" id="c_${esc(p.hex)}" data-hex="${esc(p.hex)}">
    <div class="where">${p.mil ? '<b style="color:#c0392b">軍用機</b>　' : ''}${dirName(p.dir)} ${p.dist.toFixed(1)}km・見上げ角 ${Math.round(p.elev)}°</div>
    <div class="route">${esc(rt)}</div>
    <div class="info">${esc(info)}</div>
    <div class="small">${alt}${p.kmh ? '・時速' + p.kmh + 'km' : ''}</div></div>`;
}
function render() {
  $('head').textContent = `${planes.length}機（半径${$('rad').value}km）` + (usingDef ? '　※現在地が取れないため南大沢付近を中心にしています' : '');
  $('list').innerHTML = planes.length ? planes.map(cardHtml).join('') : '<div class="small">いま範囲内に飛んでいる機体はありません</div>';
  $('list').querySelectorAll('.card').forEach(c => c.onclick = () => select(c.dataset.hex, false));
  const keep = new Set();
  planes.forEach(p => {
    keep.add(p.hex);
    let m = markers.get(p.hex);
    if (!m) {
      const el = document.createElement('div'); el.className = 'plane';
      el.onclick = e => { e.stopPropagation(); select(p.hex, true); };
      m = new mapboxgl.Marker({element:el, rotationAlignment:'map'}).setLngLat(p.p).addTo(map);
      markers.set(p.hex, m);
    }
    m.setLngLat(p.p).setRotation(p.track || 0);
    m.getElement().innerHTML = planeSvg(p.mil ? '#c0392b' : '#1f6fd1', p.hex === sel);
  });
  markers.forEach((m, hex) => { if (!keep.has(hex)) { m.remove(); markers.delete(hex); } });
  if (sel && !keep.has(sel)) sel = null;
  drawSel();
}
function select(hex, scroll) {
  sel = sel === hex ? null : hex;
  render();
  const p = planes.find(x => x.hex === sel);
  if (!p) return;
  map.fitBounds(new mapboxgl.LngLatBounds(pos, pos).extend(p.p), {padding:60, maxZoom:12});
  if (scroll) { const c = $('c_' + hex); if (c) c.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}
function drawSel() {
  const p = planes.find(x => x.hex === sel), ri = p && routeInfo(p);
  if (!ri) { setData('route', []); return; }
  const f = [];
  if (ri.orig) f.push(line(ri.orig, p.p, 'from'));
  if (ri.dest) f.push(line(p.p, ri.dest, 'to'));
  setData('route', f);
}
</script>
</body>
</html>
