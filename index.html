<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見上げ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;font-size:15px}
#map,#scopeBox{position:absolute;top:0;left:0;right:0;height:40%}
#scopeBox{display:none;background:#0d1b2a;z-index:2}
#scope{position:absolute;top:0;left:0;display:block;width:100%;height:100%}
#cam{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none}
#panel{position:absolute;top:40%;bottom:0;left:0;right:0;overflow:auto;padding:8px 10px;background:#fafafa;border-top:1px solid #ccc}
body.skyOn #scopeBox{display:block;height:60%}
body.skyOn #panel{top:60%}
@media (min-width:900px){
  #map,#scopeBox{height:auto;bottom:0;right:420px}
  #panel{top:0;left:auto;width:420px;border-top:none;border-left:1px solid #ccc}
  body.skyOn #scopeBox{height:auto}
  body.skyOn #panel{top:0}
}
select,button{font-size:15px;padding:5px 8px;margin:2px 4px 2px 0}
button.on{background:#c0392b;color:#fff;border:1px solid #c0392b;border-radius:4px}
label{white-space:nowrap;margin-right:6px}
.card{border:1px solid #ccc;border-left:6px solid #1f6fd1;border-radius:6px;padding:6px 8px;margin:6px 0;background:#fff;line-height:1.5;cursor:pointer}
.card.mil{border-left-color:#c0392b;background:#fff6f5}
.card.sel{outline:2px solid #333}
.where{font-size:13px;color:#555}
.route{font-size:19px;font-weight:bold}
.info{font-size:14px}
.small{color:#777;font-size:12px}
.near{color:#d35400;font-weight:bold}
.card.sun{border-left-color:#e6a700;background:#fffbea}
.sunt{color:#a87400;font-weight:bold}
#iss,#night{margin:4px 0;padding:5px 8px;border-radius:6px;background:#eef3fb;color:#334;font-size:13px;line-height:1.5}
#night{background:#f1eefb}
.rideBtn{display:block;width:100%;margin:6px 0;padding:8px;font-size:16px;font-weight:bold;background:#1f3b73;color:#fff;border:none;border-radius:6px}
#ride{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:#000}
#rideMap,#rideTint,#rideFrame{position:absolute;top:0;left:0;right:0;bottom:0}
#rideTint,#rideFrame{pointer-events:none}
#rideFrame{top:12%;bottom:24%;left:7%;right:7%;border-radius:42%/34%;box-shadow:0 0 0 3000px rgba(38,40,46,.94),inset 0 0 28px 6px rgba(0,0,0,.55)}
.tint-dawn{background:linear-gradient(rgba(255,170,120,.22),rgba(90,60,120,.30))}
.tint-dusk{background:linear-gradient(rgba(255,120,40,.25),rgba(80,30,80,.38))}
.tint-night{background:rgba(0,0,30,.62)}
#rideTop{position:absolute;top:0;left:0;right:0;padding:8px 10px;background:rgba(0,0,0,.55);color:#fff}
#rideTitle{font-size:18px;font-weight:bold}
#rideSub{font-size:12px;color:#ddd}
#rideBtns{position:absolute;bottom:58px;left:0;right:0;text-align:center}
#rideBtns button{background:rgba(255,255,255,.85);border:none;border-radius:6px;padding:7px 12px}
#rideBtns button.on{background:#ffd54f;font-weight:bold}
#rideBtns #rideExit{background:#c0392b;color:#fff}
#rideMarks{position:absolute;bottom:0;left:0;right:0;min-height:50px;padding:8px 10px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1.5}
.iss{background:#fff;color:#0d1b2a;border:2px solid #0d1b2a;border-radius:10px;font:bold 11px sans-serif;padding:1px 5px;white-space:nowrap}
.plane{cursor:pointer;line-height:0}
#detail{display:none;border:2px solid #333;border-radius:6px;background:#fff;padding:6px 8px;margin:6px 0;line-height:1.5}
#detail img{width:100%;max-height:230px;object-fit:cover;border-radius:4px;display:block;margin-top:4px}
#toast{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;background:#c0392b;color:#fff;padding:10px 16px;border-radius:8px;font-size:16px;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.4);max-width:92%;text-align:center;cursor:pointer}
#zukan,#cities{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#fff;overflow:auto;padding:12px}
#citiesMap{height:45vh;margin-top:8px;border-radius:6px}
.reset{float:right;background:#fff;color:#c0392b;border:1px solid #c0392b;border-radius:4px;font-size:13px}
#zukan table,#cities table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
#zukan td,#zukan th,#cities td,#cities th{border-bottom:1px solid #ddd;padding:5px 4px;text-align:left}
</style>
</head>
<body>
<div id="map"></div>
<div id="ride">
  <div id="rideMap"></div><div id="rideTint"></div><div id="rideFrame"></div>
  <div id="rideTop"><div id="rideTitle"></div><div id="rideSub"></div></div>
  <div id="rideBtns"><button data-v="left">左窓</button><button data-v="front">前方</button><button data-v="right">右窓</button><button id="rideExit">降りる</button></div>
  <div id="rideMarks"></div>
</div>
<div id="scopeBox"><video id="cam" playsinline muted autoplay></video><canvas id="scope"></canvas></div>
<div id="toast"></div>
<div id="zukan">
  <button id="zukanClose">閉じる</button> <b>機種図鑑</b>　<span id="zukanSum" class="small"></span><button id="zukanReset" class="reset">記録を消す</button>
  <table><thead><tr><th>機種</th><th>回数</th><th>初めて見た日</th><th>最近</th></tr></thead><tbody id="zukanBody"></tbody></table>
  <div class="small" style="margin-top:8px">同じ機体は1日1回だけ数えます。地上の機体は数えません。「軍」は軍用機として見たことがある機種です。</div>
</div>
<div id="cities">
  <button id="citiesClose">閉じる</button> <b>この空から行った都市</b><button id="citiesReset" class="reset">記録を消す</button>
  <div id="citiesSum" style="margin-top:6px;font-weight:bold"></div>
  <div id="citiesMap"></div>
  <table><thead><tr><th>都市</th><th>回数</th><th>初めて</th><th>距離</th></tr></thead><tbody id="citiesBody"></tbody></table>
  <div class="small" style="margin-top:8px">近く（10km以内）を通った旅客機の行き先を、同じ便は1日1回だけ数えます。</div>
</div>
<div id="panel">
  <div>
    範囲：<select id="rad"><option>10</option><option>20</option><option selected>30</option><option>50</option><option>100</option><option>150</option></select>km
    並び：<select id="sort"><option value="dist">近い順</option><option value="come">これから来る順</option></select>
    <label><input type="checkbox" id="ground">地上も</label>
  </div>
  <div>
    <button id="skyBtn">空に向ける</button><button id="zukanBtn">図鑑</button><button id="citiesBtn">都市</button>
    <label><input type="checkbox" id="ntfMil" checked>軍用機を知らせる</label>
    <label><input type="checkbox" id="ntfOver" checked>真上通過を知らせる</label>
  </div>
  <div id="skyCtl" style="display:none">
    <button id="camBtn">カメラ</button>
    補正 <button id="offMinus">−5°</button><span id="offVal">0°</span><button id="offPlus">＋5°</button>
    <span id="fovCtl" style="display:none">画角 <button id="fovMinus">狭く</button><button id="fovPlus">広く</button></span><br>
    <span id="skyInfo" class="small">スマホを写真を撮るように機体へ向けてください。照準の機体をタップで詳細</span>
  </div>
  <div id="iss"></div>
  <div id="night"></div>
  <div id="detail"></div>
  <div id="head" class="small">現在地を取得中…</div>
  <div id="list"></div>
  <div id="err" class="small" style="color:#c00"></div>
  <div class="small"><span id="upd"></span></div>
  <div class="small">機体データ：adsb.lol（中継経由）　行き先：adsbdb　写真：Planespotters.net　宇宙ステーションの軌道：CelesTrak ほか　天体の計算：Astronomy Engine</div>
</div>
<script>window.addEventListener('error', e => { const el = document.getElementById('err'); if (el) el.textContent = 'エラー：' + e.message + '（' + String(e.filename || '').split('/').pop() + ' ' + e.lineno + '行目）'; });</script>
<script src="config.js?v=7"></script>
<script src="data.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
